{% extends "base.html" %}
{% block title %}New action{% endblock %}
{% block content %}
<h1>New action</h1>
<form method="post" action="{{ url_for('create_action') }}">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" maxlength="200" required
           value="{{ form.get('title', '') }}">

    <label for="description">Description</label>
    <textarea id="description" name="description" maxlength="2000" rows="5">{{ form.get('description', '') }}</textarea>

    <label for="lever">Lever</label>
    <select id="lever" name="lever" required>
        <option value="">Choose a lever</option>
        {% for lever in levers %}
        <option value="{{ lever }}" {% if form.get('lever') == lever %}selected{% endif %}>{{ lever|replace('_', ' ') }}</option>
        {% endfor %}
    </select>

    <label for="cost_eur">Cost (€)</label>
    <input type="number" id="cost_eur" name="cost_eur" min="0" step="0.01"
           value="{{ form.get('cost_eur', '0') }}">

    <label for="cost_hours">Cost (hours)</label>
    <input type="number" id="cost_hours" name="cost_hours" min="0" step="0.25"
           value="{{ form.get('cost_hours', '0') }}">

    <button type="submit">Create action</button>
</form>
{% endblock %}
